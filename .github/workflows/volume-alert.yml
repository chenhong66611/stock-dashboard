name: 量能分析推送

on:
  # 北京时间 9:00-16:55 每5分钟（UTC = 北京-8）
  # 延长到 16:55：GitHub schedule 高负载时跳过/延迟（实测 15:05 复盘检查点整段被跳），
  # 多留 1 小时让迟到的 run 能兜底补发复盘
  schedule:
    - cron: '*/5 1-8 * * 1-5'
  # 手动触发（调试用）：force 填 morning / signal / review 可强制发对应邮件
  workflow_dispatch:
    inputs:
      force:
        description: '强制发送类型 (morning/signal/review，留空=按时间自动)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 分析 + 决策（生成 mail.html / mail_subject.txt，无需发送时不生成）
      - name: 量能分析
        run: |
          if [ -n "${{ github.event.inputs.force }}" ]; then
            ALERT_TYPE="${{ github.event.inputs.force }}" node scripts/analyze.mjs
          else
            node scripts/analyze.mjs
          fi

      # 发送邮件（Gmail发件 → QQ邮箱收件）
      - name: 发送邮件
        if: hashFiles('mail.html') != ''
        env:
          SMTP_HOST: 'smtp.gmail.com'
          SMTP_PORT: '465'
          SMTP_USER: 'qq3267254907@gmail.com'
          SMTP_CODE: ${{ secrets.SMTP_CODE }}
          SMTP_TO: '3267254907@qq.com'
        run: python scripts/sendmail.py

      # 记录本次发送（防重/状态），推回仓库
      # .alert-last 有变化 = 真的发了邮件；只有 state.json 变化 = 纯状态更新
      - name: 记录发送标记
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add .alert-last state.json
          if git diff --cached --quiet; then
            echo "无状态变化，跳过提交"
            exit 0
          fi
          if git diff --cached --quiet .alert-last; then
            MSG="state update"
          else
            MSG="alert sent: $(cat .alert-last)"
          fi
          git commit -m "$MSG" || true
          git push || true
